# docker/nginx.conf
# Optional reverse proxy (compose profile "tls"). The app container already
# terminates TLS itself; this hop adds public header hardening and is only
# needed when sharing the vault beyond a single host.
server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                  always;
    add_header Referrer-Policy           no-referrer              always;
    add_header X-Frame-Options           DENY                     always;

    # SSE scan progress must never be buffered
    location / {
        proxy_pass             https://app:4173;
        proxy_ssl_verify       off;          # app cert is a local cert, not a public CA
        proxy_ssl_server_name  on;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
        proxy_buffering        off;
        proxy_read_timeout     1h;
    }
}
